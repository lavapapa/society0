[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society0"
version = "6.0.0"
authors = [
  { name="Society0 contributors" },
]
description = "Code-driven social simulation core for researchers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["apsw>=3.53.4.0", "jsonschema>=4.0.0", "python-rapidjson==1.25", "backports-zstd==1.7.0"]

[project.optional-dependencies]
llm = ["pydantic-ai-slim[openai]==2.54.0", "Authlib==1.8.0", "httpx2", "aiolimiter", "society0-filesystem"]
anthropic = ["society0[llm]", "pydantic-ai-slim[anthropic]==2.54.0"]
google = ["society0[llm]", "pydantic-ai-slim[google]==2.54.0"]
memory = ["chromadb", "json-repair"]
social = ["networkx", "pydantic", "chromadb"]
shell = ["bashkit==0.18.2", "society0-filesystem"]
observe = ["starlette==1.7.0", "uvicorn==0.52.1"]
dev = [
    "pytest", "pytest-asyncio",
    "society0[llm,memory,social,observe]", "hypothesis",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
society0-filesystem = { path = "native/society0-filesystem" }
