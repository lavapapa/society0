[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society0"
version = "2.2.0"
authors = [
  { name="Society0 contributors" },
]
description = "Code-driven social simulation core for researchers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "json-repair",
    "jsonschema>=4.0.0",
    "networkx",
    "pydantic",
    "chromadb",
    "ollama",
    "openai",
    "PyYAML",
    "jmespath",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]
