[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society0"
version = "6.0.0"
authors = [
  { name="Society0 contributors" },
]
description = "Code-driven social simulation core for researchers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["apsw>=3.53.4.0", "jsonschema>=4.0.0", "python-rapidjson==1.25"]

[project.optional-dependencies]
llm = ["openai", "ollama", "pydantic", "tenacity"]
memory = ["chromadb", "json-repair"]
social = ["networkx", "pydantic", "chromadb"]
datasets = ["zstandard>=0.23"]
shell = ["bashkit==0.18.2", "society0-filesystem"]
dev = [
    "pytest", "pytest-asyncio",
    "openai", "ollama", "pydantic", "tenacity", "chromadb", "json-repair", "networkx", "zstandard>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
society0-filesystem = { path = "native/society0-filesystem" }
