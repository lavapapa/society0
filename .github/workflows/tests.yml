name: tests

on:
  pull_request:
  push:
    branches: [next, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOCIETY0_RUN_REAL_E2E: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.12'
          enable-cache: true
      - name: Install Python and native toolchain
        run: |
          uv python install 3.12
          rustup toolchain install 1.95.0 --profile minimal
      - name: Install locked public package
        run: uv sync --frozen --all-extras --python 3.12
      - name: Test public runtime and local experiments
        run: uv run --no-sync pytest tests/primary tests/e2e tests/experiments -m 'not real_e2e'
      - name: Build public distributions
        run: |
          uv build
          CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=${HOME:?}=/build-home" uv build native/society0-filesystem --out-dir dist
          cp constraints.txt dist/constraints.txt
      - name: Verify distribution scope
        run: uv run --no-sync python scripts/check_release.py dist
      - name: Install wheels in an independent environment
        run: |
          uv venv "$RUNNER_TEMP/installed" --python 3.12
          uv pip install --python "$RUNNER_TEMP/installed/bin/python" --constraint constraints.txt --find-links dist 'society0[llm,memory,social,shell,observe]==2.0.0a1'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: society0-next-linux
          path: dist/*
          if-no-files-found: error
