[package]
name = "society0-filesystem"
version = "0.1.0"
edition = "2024"

[lib]
name = "society0_filesystem"
crate-type = ["cdylib"]

[dependencies]
bashkit = { version = "=0.18.2", default-features = false, features = ["interop"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
async-trait = "0.1"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"

[build-dependencies]
pyo3-build-config = "0.29"

[profile.dev]
debug = 0
