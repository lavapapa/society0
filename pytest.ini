[pytest]
addopts = -q -rs
pythonpath = src
asyncio_mode = auto
testpaths =
    tests/primary
    tests/e2e
markers =
    primary: recommended Society0 public-path tests
    e2e: end-to-end tests that use the runtime across components
    real_e2e: opt-in tests that require live LLM and embedding endpoints
    saturation: stricter real endpoint tests that intentionally exercise concurrent LLM and embedding load
    legacy: retained tests for old schedule/studio behavior and migration coverage
